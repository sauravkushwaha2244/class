<html>
    <head>
        <title>students registration form</title>
<body>
        <style>
        
    
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid ;
            border-radius: 4px;
        }
        
        
        
        


            </style>
            
    
    <h1>Students Registration form</h1>
    <form action="./attribute.html" method="get"></form>
    <label for="full name">full name:</label>
     <input type="text" id="full name" name="full name" required>
     <label for="email">email</label>
     <input type="email" id="email" name="email" required>
     <label for="password">password</label>
     <input type="password" id="password" name="password" required>
     <label for="gender">gender</label>
     <select id="gender" name="gender" required>
     <option value="male">male</option>
     <option value="female">female</option>
     </select>
     
     <label for ="course"> course:</label>
     <select id="course" name="course" required>
       <option value="">select course</option>
       <option value="web desigening">web desigening</option>
       <option value="electrical">electrical</option>
       <option value="applied physics">applied physics</option>
       <option value="ai">ai</option>
       </select>
     
      
     <label for="contact no">contact number</label>
     <input type="number" id="contact no" name="contact no" required>

     <label for="address"><address></address>:</label>
             <textarea id = "address " name="address" rows = "8" placeholder = "enter your address"> </textarea>
             <button type = "register">register</button>
             <button type = "clear"class = "clear">clear</button
</body>
</head>
</html>
