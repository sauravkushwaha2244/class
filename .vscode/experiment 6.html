<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ShopEasy — Classic Cotton T-Shirt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">ShopEasy</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Men</a>
        <a href="#">Women</a>
        <a href="#">Sale</a>
      </nav>
    </div>
  </header>

  <main class="container product-page">
    <section class="product-card">
      <div class="product-media">
        <img src="qrhgqxXbgPJotHaWutpDx.png" alt="Classic Cotton T-Shirt" class="product-image">
        <div class="color-swatches">
          <button aria-label="Green" class="swatch active" style="background:#4CAF50"></button>
          <button aria-label="Black" class="swatch" style="background:#222"></button>
          <button aria-label="White" class="swatch" style="background:#fff;border:1px solid #ddd"></button>
        </div>
      </div>

      <div class="product-details">
        <h1 class="product-title">Classic Cotton T-Shirt</h1>
        <p class="subtitle">Soft, breathable cotton. Regular fit. Available in multiple colors.</p>

        <div class="price-row">
          <div class="price">
            <span class="current">₹799</span>
            <span class="original">₹1,199</span>
            <span class="badge">33% OFF</span>
          </div>
        </div>

        <div class="purchase">
          <label for="size" class="label">Size</label>
          <select id="size" class="select">
            <option>Small</option>
            <option selected>Medium</option>
            <option>Large</option>
            <option>XL</option>
          </select>

          <label class="label">Quantity</label>
          <div class="qty">
            <button class="qty-btn" id="dec">−</button>
            <input type="number" id="quantity" value="1" min="1" class="qty-input">
            <button class="qty-btn" id="inc">+</button>
          </div>

          <button class="btn add-cart" id="addToCart">Add to Cart</button>
        </div>

        <details class="more-info">
          <summary class="label">Product details</summary>
          <ul>
            <li>100% cotton; gentle machine wash</li>
            <li>Regular fit with ribbed neckline</li>
            <li>Model wears size M and is 6'0"</li>
          </ul>
        </details>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© ShopEasy</p>
    </div>
  </footer>

  <script>
    // Small interactive bits: quantity buttons
    const dec = document.getElementById('dec');
    const inc = document.getElementById('inc');
    const qtyInput = document.getElementById('quantity');

    dec.addEventListener('click', () => {
      const v = Math.max(1, parseInt(qtyInput.value || 1) - 1);
      qtyInput.value = v;
    });
    inc.addEventListener('click', () => {
      const v = Math.max(1, parseInt(qtyInput.value || 1) + 1);
      qtyInput.value = v;
    });
    document.getElementById('addToCart').addEventListener('click', () => {
      alert('Added to cart: ' + qtyInput.value + ' × Classic Cotton T-Shirt');
    });
  </script>
</body>
</html>
